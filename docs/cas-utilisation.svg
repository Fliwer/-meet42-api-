<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 1060" role="img"
     aria-label="Diagramme de cas d'utilisation Meet42 : le Visiteur consulte la carte, recherche, ouvre une fiche, crée un compte et se connecte ; le Membre, qui hérite du Visiteur, gère son profil, crée, rejoint et quitte un groupe et discute dedans ; créer et rejoindre un groupe incluent tous deux la déclaration d'intérêt ; un planificateur déclenche l'import des événements depuis l'API externe, import qui inclut la normalisation et le dédoublonnage.">
  <style>
    /* Palette embarquée : le fichier s'ouvre seul dans un navigateur,
       s'insère dans un document, et suit le thème clair / sombre. */
    svg {
      --ground:      #FFFFFF;
      --surface-2:   #F1F1F7;
      --ink:         #14161F;
      --ink-3:       #7A7D93;
      --indigo:      #5B4BE0;
      --indigo-soft: #EEECFD;
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--ground);
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --ground:      #0C0E15;
        --surface-2:   #1E2230;
        --ink:         #E9EAF2;
        --ink-3:       #767B92;
        --indigo:      #9A92FF;
        --indigo-soft: #211F3D;
      }
    }
  </style>

  <rect x="0" y="0" width="1140" height="1060" fill="var(--ground)"/>

  <defs>
    <marker id="openArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="var(--indigo)" stroke-width="1.6"/>
    </marker>
  </defs>

  <!-- Frontière du système -->
  <rect x="230" y="45" width="660" height="970" rx="4"
        fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.45"/>
  <text x="560" y="76" text-anchor="middle" font-size="15" font-weight="700"
        fill="currentColor" letter-spacing="0.08em">MEET42</text>

  <!-- ============ ACTEURS ============ -->
  <!-- Visiteur -->
  <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round">
    <circle cx="110" cy="200" r="16"/>
    <line x1="110" y1="216" x2="110" y2="258"/>
    <line x1="86"  y1="232" x2="134" y2="232"/>
    <line x1="110" y1="258" x2="92"  y2="292"/>
    <line x1="110" y1="258" x2="128" y2="292"/>
  </g>
  <text x="110" y="315" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">Visiteur</text>

  <!-- Membre -->
  <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round">
    <circle cx="110" cy="690" r="16"/>
    <line x1="110" y1="706" x2="110" y2="748"/>
    <line x1="86"  y1="722" x2="134" y2="722"/>
    <line x1="110" y1="748" x2="92"  y2="782"/>
    <line x1="110" y1="748" x2="128" y2="782"/>
  </g>
  <text x="110" y="805" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">Membre</text>

  <!-- Généralisation Membre -> Visiteur -->
  <line x1="110" y1="664" x2="110" y2="352" stroke="currentColor" stroke-width="1.4"/>
  <polygon points="110,336 102,354 118,354" fill="var(--ground)" stroke="currentColor" stroke-width="1.4"/>

  <!-- Planificateur -->
  <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round">
    <circle cx="1030" cy="100" r="16"/>
    <line x1="1030" y1="116" x2="1030" y2="158"/>
    <line x1="1006" y1="132" x2="1054" y2="132"/>
    <line x1="1030" y1="158" x2="1012" y2="192"/>
    <line x1="1030" y1="158" x2="1048" y2="192"/>
  </g>
  <text x="1030" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Planificateur</text>
  <text x="1030" y="233" text-anchor="middle" font-size="11" fill="var(--ink-3)">&#171;system&#187;</text>

  <!-- API externe -->
  <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round">
    <circle cx="1030" cy="320" r="16"/>
    <line x1="1030" y1="336" x2="1030" y2="378"/>
    <line x1="1006" y1="352" x2="1054" y2="352"/>
    <line x1="1030" y1="378" x2="1012" y2="412"/>
    <line x1="1030" y1="378" x2="1048" y2="412"/>
  </g>
  <text x="1030" y="435" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">API événements</text>
  <text x="1030" y="453" text-anchor="middle" font-size="11" fill="var(--ink-3)">&#171;system&#187;</text>

  <!-- ============ ASSOCIATIONS ============ -->
  <g stroke="currentColor" stroke-width="1.2" opacity="0.75">
    <!-- Visiteur -->
    <line x1="140" y1="240" x2="288" y2="200"/>
    <line x1="140" y1="240" x2="288" y2="275"/>
    <line x1="140" y1="240" x2="288" y2="350"/>
    <line x1="140" y1="240" x2="288" y2="425"/>
    <line x1="140" y1="240" x2="288" y2="500"/>
    <!-- Membre -->
    <line x1="140" y1="722" x2="288" y2="585"/>
    <line x1="140" y1="722" x2="288" y2="660"/>
    <line x1="140" y1="722" x2="588" y2="735"/>
    <line x1="140" y1="722" x2="288" y2="810"/>
    <line x1="140" y1="722" x2="288" y2="885"/>
    <line x1="140" y1="722" x2="288" y2="960"/>
    <!-- Systèmes -->
    <line x1="1000" y1="132" x2="812" y2="110"/>
    <line x1="812"  y1="122" x2="1000" y2="300"/>
  </g>

  <!-- ============ CAS D'UTILISATION ============ -->
  <g font-size="13" text-anchor="middle">

    <!-- Ingestion -->
    <ellipse cx="700" cy="110" rx="112" ry="30" fill="var(--surface-2)" stroke="currentColor" stroke-width="1.3"/>
    <text x="700" y="115" fill="currentColor">Importer les événements</text>

    <ellipse cx="400" cy="110" rx="112" ry="30" fill="var(--surface-2)" stroke="currentColor" stroke-width="1.3"/>
    <text x="400" y="115" fill="currentColor">Normaliser &amp; dédoublonner</text>

    <!-- Découverte -->
    <ellipse cx="400" cy="200" rx="112" ry="30" fill="var(--surface-2)" stroke="currentColor" stroke-width="1.3"/>
    <text x="400" y="205" fill="currentColor">Consulter la carte</text>

    <ellipse cx="400" cy="275" rx="112" ry="30" fill="var(--surface-2)" stroke="currentColor" stroke-width="1.3"/>
    <text x="400" y="280" fill="currentColor">Rechercher &amp; filtrer</text>

    <ellipse cx="400" cy="350" rx="112" ry="30" fill="var(--surface-2)" stroke="currentColor" stroke-width="1.3"/>
    <text x="400" y="355" fill="currentColor">Consulter une fiche</text>

    <ellipse cx="700" cy="350" rx="112" ry="30" fill="var(--surface-2)" stroke="currentColor" stroke-width="1.3"/>
    <text x="700" y="355" fill="currentColor">Voir les intéressés</text>

    <ellipse cx="400" cy="425" rx="112" ry="30" fill="var(--surface-2)" stroke="currentColor" stroke-width="1.3"/>
    <text x="400" y="430" fill="currentColor">Créer un compte</text>

    <ellipse cx="400" cy="500" rx="112" ry="30" fill="var(--surface-2)" stroke="currentColor" stroke-width="1.3"/>
    <text x="400" y="505" fill="currentColor">Se connecter</text>

    <!-- Membre -->
    <ellipse cx="400" cy="585" rx="112" ry="30" fill="var(--surface-2)" stroke="currentColor" stroke-width="1.3"/>
    <text x="400" y="590" fill="currentColor">Gérer mon profil</text>

    <ellipse cx="400" cy="660" rx="112" ry="30" fill="var(--surface-2)" stroke="currentColor" stroke-width="1.3"/>
    <text x="400" y="665" fill="currentColor">Créer un groupe</text>

    <ellipse cx="700" cy="735" rx="112" ry="30" fill="var(--indigo-soft)" stroke="var(--indigo)" stroke-width="1.6"/>
    <text x="700" y="740" fill="var(--indigo)" font-weight="600">Déclarer son intérêt</text>

    <ellipse cx="700" cy="585" rx="112" ry="30" fill="var(--surface-2)" stroke="currentColor" stroke-width="1.3"/>
    <text x="700" y="590" fill="currentColor">Personnaliser le groupe</text>

    <ellipse cx="400" cy="810" rx="112" ry="30" fill="var(--surface-2)" stroke="currentColor" stroke-width="1.3"/>
    <text x="400" y="815" fill="currentColor">Rejoindre un groupe</text>

    <ellipse cx="400" cy="885" rx="112" ry="30" fill="var(--surface-2)" stroke="currentColor" stroke-width="1.3"/>
    <text x="400" y="890" fill="currentColor">Quitter un groupe</text>

    <ellipse cx="400" cy="960" rx="112" ry="30" fill="none" stroke="var(--ink-3)" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="400" y="965" fill="var(--ink-3)">Discuter dans le groupe</text>
  </g>

  <!-- ============ INCLUDE / EXTEND ============ -->
  <g stroke="var(--indigo)" stroke-width="1.4" stroke-dasharray="6 4" fill="none" marker-end="url(#openArrow)">
    <line x1="588" y1="110" x2="516" y2="110"/>
    <line x1="512" y1="660" x2="584" y2="722"/>
    <line x1="512" y1="810" x2="584" y2="750"/>
    <line x1="588" y1="350" x2="516" y2="350"/>
    <line x1="600" y1="608" x2="500" y2="650"/>
  </g>

  <g font-size="11" fill="var(--indigo)" font-style="italic" text-anchor="middle">
    <text x="552" y="100">&#171;include&#187;</text>
    <text x="536" y="700">&#171;include&#187;</text>
    <text x="540" y="800">&#171;include&#187;</text>
    <text x="552" y="340">&#171;extend&#187;</text>
    <text x="556" y="620">&#171;extend&#187;</text>
  </g>

  <text x="110" y="510" text-anchor="middle" font-size="11" fill="var(--ink-3)" font-style="italic">hérite de</text>
</svg>
